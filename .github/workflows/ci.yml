# Intégration continue de Shinku.
#
# Trois travaux, du moins cher au plus cher :
#   - « Cœur et interface » (Linux) : format, lint, tests du cœur, tests et
#     compilation de l'interface.
#   - « Lint de la cible Windows » (Linux) : le code propre à Windows, que le
#     premier travail ne compile pas, passe au lint par compilation croisée.
#   - « Windows » : les tests du cœur sur un vrai NTFS, puis l'installeur,
#     parcouru page par page, installé et essayé pour de bon (la fenêtre, puis
#     le mode jeu) avant d'être publié.
#
# Les minutes Windows comptent double sur un dépôt privé : tout ce qui peut
# être vérifié sous Linux l'est sous Linux.

name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      captures_dans_le_journal:
        description: "Écrire aussi les captures de l'installeur dans le journal (JPEG en base64)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  coeur-et-interface:
    name: Cœur et interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/shinku/package-lock.json

      # La version de Rust est fixée par rust-toolchain.toml.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" \
            --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests du cœur
        run: cargo test --workspace --locked

      - name: Dépendances de l'interface
        working-directory: apps/shinku
        run: npm ci

      - name: Types de l'interface
        working-directory: apps/shinku
        run: npm run check

      - name: Tests de l'interface, du contrat et du câblage
        working-directory: apps/shinku
        run: npm test

      - name: Compilation de l'interface
        working-directory: apps/shinku
        run: npm run build

  lint-windows:
    name: Lint de la cible Windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/shinku/package-lock.json

      # La version de Rust est fixée par rust-toolchain.toml.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" \
            --profile minimal --component rustfmt --component clippy

      - name: Compilateur croisé
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mingw-w64
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu

      # L'application embarque l'interface : elle doit être compilée d'abord.
      - name: Interface
        working-directory: apps/shinku
        run: |
          npm ci
          npm run build

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings

  windows:
    name: Windows
    runs-on: windows-latest
    # 60 minutes : l'essai de la confidentialité (jusqu'à 20 minutes, jamais mesuré) s'ajoute aux autres essais.
    timeout-minutes: 60
    env:
      # Vaut « true » quand le lancement à la main demande les captures de
      # l'installeur dans le journal (essai-installeur.ps1).
      CAPTURES_DANS_LE_JOURNAL: ${{ inputs.captures_dans_le_journal }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/shinku/package-lock.json

      # La version de Rust est fixée par rust-toolchain.toml.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" \
            --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Tests du cœur sur un vrai NTFS
        run: cargo test --locked -p shinku-core -p shinku-helper -p shinku-agent

      # La machine est jetable : ces essais-là envoient des fichiers qu'ils
      # fabriquent à la vraie corbeille de Windows, changent ses réglages pour
      # le compte, les remettent, puis la vident. Ils tournent à part, un par
      # un, et leur sortie est montrée : les lignes « FAIT : » disent ce que
      # Windows fait seul quand la corbeille est trop petite.
      - name: La vraie corbeille de Windows
        env:
          SHINKU_ESSAI_CORBEILLE: 1
          SHINKU_ESSAI_VIDE_LA_CORBEILLE: 1
        run: >-
          cargo test --locked -p shinku-core --lib platform::windows::shell::tests
          -- --nocapture --test-threads=1

      - name: Dépendances de l'interface
        working-directory: apps/shinku
        run: npm ci

      # Compile l'interface, puis l'agent du mode jeu et l'assistant élevé du
      # Démarrage (beforeBuildCommand, dans target/release), puis shinku.exe en
      # version finale, puis l'installeur NSIS, qui embarque l'agent et
      # l'assistant par ses crochets (installeur/habillage.nsh, puis
      # installeur/agent.nsh et installeur/helper.nsh). Non signé : la signature
      # vient avant la version publique.
      - name: Installeur
        working-directory: apps/shinku
        run: npm run tauri build

      # L'installeur est essayé comme le ferait quelqu'un : ses pages sont
      # parcourues, leurs textes lus (aucun vouvoiement), leur aspect
      # photographié, puis le disque est vérifié. Le lancement à la main peut
      # demander que les captures soient aussi écrites dans le journal
      # (captures_dans_le_journal). Ensuite Shinku est lancé et sa fenêtre
      # essayée : il doit s'ouvrir, analyser le disque, montrer chacun de ses
      # écrans, puis faire le vide pour de bon (la machine est jetable) :
      # l'essai vérifie sur le disque ce qui est parti et ce qui est resté.
      # Sans cela, l'installeur n'est pas publié.
      - name: Installation
        id: install
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          $options = @()
          if ($env:CAPTURES_DANS_LE_JOURNAL -eq 'true') { $options += '-CapturesDansLeJournal' }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/shinku/scripts/essai-installeur.ps1 `
            -Installeur $setup.FullName -Captures "$env:RUNNER_TEMP\captures-installeur" -Etape installer @options

      # Le Démarrage : cinq entrées d'essai (quatre dans le compte, une dans le
      # PC) sont créées avant la fenêtre, qui les coupe et les remet pour de
      # bon. Le script tourne en administrateur, et crée seul l'entrée du PC ;
      # la fenêtre tourne avec les droits ordinaires du même compte : HKCU est
      # le même.
      - name: Préparer l'essai du Démarrage
        working-directory: apps/shinku
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-demarrage.ps1 -Preparer

      # La Désinstallation : des apps d'essai inscrites dans le compte (une dont
      # le désinstalleur laisse trois restes, une voisine, une sans dossier, deux
      # de la même famille, et un leurre). La fenêtre désinstalle la première et
      # met ses restes à la corbeille ; le reste ne doit pas bouger.
      - name: Préparer l'essai de la désinstallation
        working-directory: apps/shinku
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-desinstallation.ps1 -Preparer

      # Les essais qui suivent tournent chacun même si un essai d'avant a
      # échoué (il suffit que Shinku soit installé) : un passage dit ainsi tout
      # ce qu'il peut dire. Le travail échoue quand même si l'un d'eux échoue.
      - name: Essai de la fenêtre
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/shinku
        run: node scripts/essai-fenetre.mjs --programme "$env:ProgramFiles\Shinku\shinku.exe" --captures "$env:RUNNER_TEMP\captures" --grand-vide

      # Le mode jeu, de bout en bout : l'agent installé reconnaît un vrai jeu
      # (une petite fenêtre compilée pour l'occasion) au premier plan, met un
      # ping en veilleuse, change le mode d'alimentation, puis remet tout en
      # place quand le jeu se ferme. Les machines de GitHub tournent en
      # administrateur : l'essai lance l'agent et le jeu avec les droits
      # ordinaires d'un utilisateur, comme sur un PC.
      - name: Essai du mode jeu
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/shinku
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-mode-jeu.ps1 -Agent "$env:ProgramFiles\Shinku\shinku-agent.exe"

      # L'assistant élevé du Démarrage, installé, sur le vrai Windows. D'abord le
      # lanceur de shinku.exe (essai Rust activé par la variable : il appelle le
      # vrai lanceur sur l'assistant installé, avec un nom qui n'existe pas :
      # code 4, aucune fenêtre ; sur une copie dans %TEMP% : refus avant tout
      # lancement). Sa sortie est montrée : les lignes « FAIT : » disent ce que
      # Windows a fait.
      - name: Essai du lanceur de l'assistant
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $env:SHINKU_ESSAI_ASSISTANT = Join-Path $env:ProgramFiles 'Shinku\shinku-helper.exe'
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding $false
          $log = Join-Path $env:RUNNER_TEMP 'essai-lanceur.txt'
          cargo test --locked -p shinku-core --lib platform::windows::launcher::tests::the_installed_helper_answers_not_found_for_a_name_that_does_not_exist -- --exact --nocapture --test-threads=1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Sans la variable, l'essai sort aussitôt en réussissant : la ligne
          # « FAIT : » prouve qu'il a vraiment tourné (lettres accentuées tolérées).
          if (-not (Select-String -Path $log -Pattern "FAIT : l'assistant install.+ r.+pond" -Quiet)) {
            throw "l'essai du lanceur n'a pas imprimé « FAIT : l'assistant installé répond » : il n'a pas tourné"
          }

      # Puis l'assistant lui-même (D9, point 2) : manifeste, demandes refusées,
      # la boîte et ses réponses, l'essai négatif depuis un processus sans droits,
      # l'échéance de deux minutes (le script dure un peu plus de deux minutes).
      # Il travaille sur « Essai Shinku PC », posée plus haut, et la remet dans
      # son état d'avant.
      - name: Essai de l'assistant élevé
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/shinku
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-assistant.ps1

      # Quoi qu'il arrive : plus aucun assistant en marche, et la seconde entrée
      # d'essai de l'échéance est retirée.
      - name: Remettre la machine d'essai en place (assistant)
        if: always()
        working-directory: apps/shinku
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-assistant.ps1 -Nettoyer

      # Quoi qu'il arrive : le mode d'alimentation, les réglages et le journal
      # d'origine sont remis, et ce qui reste de l'essai est arrêté.
      - name: Remettre la machine d'essai en place
        if: always()
        working-directory: apps/shinku
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-mode-jeu.ps1 -Restaurer

      # Quoi qu'il arrive : les cinq entrées d'essai et leurs approbations sont retirées.
      - name: Remettre la machine d'essai en place (démarrage)
        if: always()
        working-directory: apps/shinku
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-demarrage.ps1 -Nettoyer

      # Quoi qu'il arrive : les apps d'essai de la désinstallation, leurs
      # inscriptions, leurs dossiers et leurs raccourcis sont retirés.
      - name: Remettre la machine d'essai en place (désinstallation)
        if: always()
        working-directory: apps/shinku
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-desinstallation.ps1 -Nettoyer

      # La Confidentialité, pour de bon, sur le vrai Windows : la vraie fenêtre
      # efface un faux profil Chrome (de vraies bases SQLite), des valeurs du
      # registre, les récents et le presse-papiers, et refuse ce qu'elle doit
      # refuser (un fichier tenu ouvert, un lockfile, une jonction, un lien
      # physique, un lien de registre, un profil remplacé). Chaque preuve
      # imprime une ligne « FAIT : » qui dit ce qui a été mesuré. CET ESSAI
      # EFFACE VRAIMENT : la variable n'est posée que sur ces deux étapes,
      # jamais sur le travail, et la machine est jetable. Le vrai Chrome, s'il
      # est installé, est lancé puis fermé par l'essai.
      - name: Essai de la confidentialité
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: apps/shinku
        env:
          SHINKU_ESSAI_CONFIDENTIALITE: '1'
        run: node scripts/essai-confidentialite.mjs --programme "$env:ProgramFiles\Shinku\shinku.exe" --captures "$env:RUNNER_TEMP\captures-confidentialite"

      # Quoi qu'il arrive : le User Data de Chrome d'origine est remis, l'essai
      # défait ses pièges (lien de registre, dossier épinglé, fenêtre de
      # l'Explorateur, raccourci récent) et plus aucun processus ne tient un
      # fichier. Les trois clés du registre et les récents sont VIDÉS, pas
      # remis dans leur état d'avant, et le presse-papiers n'est pas touché :
      # la machine est jetable.
      - name: Remettre la machine d'essai en place (confidentialité)
        if: always()
        timeout-minutes: 5
        working-directory: apps/shinku
        env:
          SHINKU_ESSAI_CONFIDENTIALITE: '1'
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-confidentialite.ps1 -Etape nettoyer

      - name: Publier les captures de la confidentialité
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-de-la-confidentialite
          path: ${{ runner.temp }}/captures-confidentialite
          if-no-files-found: ignore
          retention-days: 14

      # Shinku est déjà installé : l'installeur doit le dire, et rien ne doit
      # changer sur le disque quand on annule.
      - name: Installeur sur une installation existante
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          $options = @()
          if ($env:CAPTURES_DANS_LE_JOURNAL -eq 'true') { $options += '-CapturesDansLeJournal' }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/shinku/scripts/essai-installeur.ps1 `
            -Installeur $setup.FullName -Captures "$env:RUNNER_TEMP\captures-installeur" -Etape deja-installe @options

      # Les crochets de l'installeur, avec un agent qui tourne : l'installeur
      # tout juste fabriqué est relancé par-dessus l'installation (mise à jour),
      # puis Shinku est désinstallé. Dans les deux cas, plus aucun agent ne doit
      # rester, la valeur de démarrage doit suivre (rester à la mise à jour,
      # partir à la désinstallation) et le dossier d'installation disparaître.
      # Shinku n'est plus installé ensuite : les étapes qui suivent le
      # réinstallent elles-mêmes. L'installeur n'est publié que si tout a réussi.
      - name: Essai de la mise à jour et de la désinstallation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/shinku
        run: |
          $setup = Get-ChildItem "$env:GITHUB_WORKSPACE/target/release/bundle/nsis" -Filter *-setup.exe | Select-Object -First 1
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-installeur-agent.ps1 -Installeur $setup.FullName

      - name: Remettre la machine d'essai en place (installeur)
        if: always()
        working-directory: apps/shinku
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/essai-installeur-agent.ps1 -Restaurer

      - name: Publier les captures de la fenêtre
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-de-la-fenetre
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
          retention-days: 14

      # Le mode silencieux (/S) n'a pas de fenêtre : il garde sa propre preuve,
      # un aller-retour installation, vérification, désinstallation. L'essai
      # d'avant a laissé Shinku désinstallé, et celui-ci aussi. Il ne touche pas
      # aux réglages laissés par les essais d'avant (ceux de la fenêtre, le
      # journal du grand vide) : l'étape suivante doit les voir disparaître.
      - name: Aller-retour silencieux
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          $dossier = "$env:ProgramFiles\Shinku"
          # Une désinstallation silencieuse ne doit jamais supprimer les réglages.
          $reglages = "$env:APPDATA\Shinku\settings.json"
          New-Item -ItemType Directory -Force -Path (Split-Path $reglages) | Out-Null
          if (-not (Test-Path -LiteralPath $reglages)) { Set-Content -LiteralPath $reglages -Value '{}' -Encoding ASCII }
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "L'installation silencieuse s'arrête avec le code $($install.ExitCode)." }
          foreach ($fichier in 'shinku.exe', 'shinku-agent.exe', 'shinku-helper.exe', 'uninstall.exe') {
            if (-not (Test-Path "$dossier\$fichier")) { throw "L'installation silencieuse n'a pas posé $fichier." }
          }
          # Le désinstalleur se recopie dans le dossier temporaire
          # (%TEMP%\~nsu<n>.tmp\Un.exe) et rend la main aussitôt. Le dossier
          # d'installation part avant la fin (raccourcis, registre, réglages) :
          # on attend donc aussi que cette copie ait fini, sans quoi le contrôle
          # des réglages ne prouverait rien, et l'installation de l'étape
          # suivante courrait en même temps qu'elle.
          Start-Process -FilePath "$dossier\uninstall.exe" -ArgumentList '/S' -Wait
          $limite = (Get-Date).AddSeconds(120)
          do {
            Start-Sleep -Milliseconds 500
            $copies = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path -like '*\~nsu*.tmp\Un*.exe' })
          } while (((Test-Path $dossier) -or $copies.Count -gt 0) -and (Get-Date) -lt $limite)
          if ($copies.Count -gt 0) { throw "Le désinstalleur silencieux tourne encore après 120 s." }
          if (Test-Path $dossier) { throw "La désinstallation silencieuse a laissé $dossier." }
          if (-not (Test-Path -LiteralPath $reglages)) { throw "La désinstallation silencieuse a supprimé les réglages." }

      # Le désinstalleur n'efface plus rien dans un profil : avec la case
      # « Supprimer aussi mes réglages », il lance `shinku.exe --oublier` avec les
      # droits ordinaires de la personne (RunAsUser) et attend par le Gestionnaire
      # de redémarrage. Trois étapes séparées, pour qu'un échec de l'une
      # n'empêche pas de lire les autres ; chacune réinstalle Shinku en silence
      # s'il n'est pas là. Si le désinstalleur affiche « Shinku n'a pas pu
      # supprimer tes réglages », l'essai ferme la boîte et échoue.
      # 1. `--oublier` lancé à la main : code 0 avec les droits ordinaires, témoins partis,
      #    au moins une seconde de vie ; code 2 et rien de touché quand le script est élevé
      #    face à un bureau qui ne l'est pas (si le runner le permet, sinon une ligne NOTE).
      - name: Désinstallation (--oublier à la main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Aucun installeur (*-setup.exe) dans target/release/bundle/nsis : l'étape « Installeur » n'a rien produit." }
          $options = @()
          if ($env:CAPTURES_DANS_LE_JOURNAL -eq 'true') { $options += '-CapturesDansLeJournal' }
          # Shinku est réinstallé en silence s'il ne l'est pas (l'essai d'avant l'a désinstallé, ou a échoué).
          if (-not (Test-Path "$env:ProgramFiles\Shinku\uninstall.exe")) {
            $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "L'installation silencieuse s'arrête avec le code $($install.ExitCode)." }
          }
          # La copie temporaire du désinstalleur d'avant a pu rester en vie : l'essai l'arrête et le note si elle dure encore.
          $limite = (Get-Date).AddSeconds(120)
          while (@(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path -like '*\~nsu*.tmp\Un*.exe' }).Count -gt 0 -and (Get-Date) -lt $limite) { Start-Sleep -Milliseconds 500 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/shinku/scripts/essai-installeur.ps1 `
            -Installeur $setup.FullName -Captures "$env:RUNNER_TEMP\captures-installeur" -Etape oublier @options

      # 2. La désinstallation avec une jonction à la place de %LOCALAPPDATA%\fr.shinku.app :
      #    le témoin posé derrière doit rester intact (voir les limites dans le script).
      - name: Désinstallation (jonction)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Aucun installeur (*-setup.exe) dans target/release/bundle/nsis : l'étape « Installeur » n'a rien produit." }
          $options = @()
          if ($env:CAPTURES_DANS_LE_JOURNAL -eq 'true') { $options += '-CapturesDansLeJournal' }
          # Shinku est réinstallé en silence s'il ne l'est pas (l'essai d'avant l'a désinstallé, ou a échoué).
          if (-not (Test-Path "$env:ProgramFiles\Shinku\uninstall.exe")) {
            $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "L'installation silencieuse s'arrête avec le code $($install.ExitCode)." }
          }
          # La copie temporaire du désinstalleur d'avant a pu rester en vie : l'essai l'arrête et le note si elle dure encore.
          $limite = (Get-Date).AddSeconds(120)
          while (@(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path -like '*\~nsu*.tmp\Un*.exe' }).Count -gt 0 -and (Get-Date) -lt $limite) { Start-Sleep -Milliseconds 500 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/shinku/scripts/essai-installeur.ps1 `
            -Installeur $setup.FullName -Captures "$env:RUNNER_TEMP\captures-installeur" -Etape desinstaller-jonction @options

      # 3. La désinstallation avec la fenêtre de Shinku ouverte : la question « Shinku est ouvert »
      #    une seule fois, puis le dossier d'installation, %APPDATA%\Shinku, %LOCALAPPDATA%\Shinku
      #    et les deux dossiers fr.shinku.app disparus, avec ce que les essais d'avant y ont
      #    vraiment écrit, et rien qui revienne.
      - name: Désinstallation (fenêtre ouverte)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Aucun installeur (*-setup.exe) dans target/release/bundle/nsis : l'étape « Installeur » n'a rien produit." }
          $options = @()
          if ($env:CAPTURES_DANS_LE_JOURNAL -eq 'true') { $options += '-CapturesDansLeJournal' }
          # Shinku est réinstallé en silence s'il ne l'est pas (l'essai d'avant l'a désinstallé, ou a échoué).
          if (-not (Test-Path "$env:ProgramFiles\Shinku\uninstall.exe")) {
            $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "L'installation silencieuse s'arrête avec le code $($install.ExitCode)." }
          }
          # La copie temporaire du désinstalleur d'avant a pu rester en vie : l'essai l'arrête et le note si elle dure encore.
          $limite = (Get-Date).AddSeconds(120)
          while (@(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path -like '*\~nsu*.tmp\Un*.exe' }).Count -gt 0 -and (Get-Date) -lt $limite) { Start-Sleep -Milliseconds 500 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/shinku/scripts/essai-installeur.ps1 `
            -Installeur $setup.FullName -Captures "$env:RUNNER_TEMP\captures-installeur" -Etape desinstaller @options

      - name: Publier les captures de l'installeur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-de-l-installeur
          path: ${{ runner.temp }}/captures-installeur
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier l'installeur
        uses: actions/upload-artifact@v4
        with:
          name: shinku-installeur-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
